<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script type="application/json" id="wos-manifest">{"id":"clock","name":"Clock","version":"1.0","icon":"🕐","category":"utilities","singleton":true,"description":"Analog clock.","winWidth":300,"winHeight":380}</script>
<style>
*,*::before,*::as{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:'Segoe UI',-apple-system,sans-serif;background:#0c0e18;color:#eaf0ff}
.clock-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:20px}
.clock-dig{font-size:46px;font-weight:200;font-family:monospace;letter-spacing:.06em}
.clock-date-str{font-size:14px;color:rgba(255,255,255,0.45);font-weight:500}
</style>
</head>
<body>
<div class="clock-wrap">
  <canvas id="ccanvas" width="180" height="180"></canvas>
  <div class="clock-dig" id="cdig"></div>
  <div class="clock-date-str" id="cdatestr"></div>
</div>
<script>
const cv = document.getElementById('ccanvas'), ctx = cv.getContext('2d');
const dig = document.getElementById('cdig'), dstr = document.getElementById('cdatestr');
const CX=90, CY=90, R=82;
const ACCENT = '#5b8af5';
function draw(){
  const now = new Date();
  ctx.clearRect(0,0,180,180);
  const gf = ctx.createRadialGradient(CX,CY,2,CX,CY,R);
  gf.addColorStop(0,'rgba(18,25,55,0.95)'); gf.addColorStop(1,'rgba(8,12,30,0.98)');
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fillStyle=gf; ctx.fill();
  const gr = ctx.createLinearGradient(CX-R,CY-R,CX+R,CY+R);
  gr.addColorStop(0,'rgba(91,138,245,0.5)'); gr.addColorStop(1,'rgba(155,89,245,0.3)');
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.strokeStyle=gr; ctx.lineWidth=2.5; ctx.stroke();
  for (let i=0;i<60;i++){
    const a=(i/60)*Math.PI*2-Math.PI/2, isH = i%5===0;
    ctx.beginPath();
    ctx.moveTo(CX+Math.cos(a)*(R-4), CY+Math.sin(a)*(R-4));
    ctx.lineTo(CX+Math.cos(a)*(R-(isH?18:9)), CY+Math.sin(a)*(R-(isH?18:9)));
    ctx.strokeStyle = isH ? 'rgba(255,255,255,0.65)' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = isH ? 2 : 1; ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='10px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
  [[12,0],[3,3],[6,6],[9,9]].forEach(([n,i]) => { const a=(i/12)*Math.PI*2-Math.PI/2; ctx.fillText(n, CX+Math.cos(a)*(R-28), CY+Math.sin(a)*(R-28)); });
  const h=now.getHours()%12, m=now.getMinutes(), s=now.getSeconds(), ms=now.getMilliseconds();
  const hand = (ang,len,w,c,glow) => {
    ctx.save(); ctx.beginPath();
    if (glow){ ctx.shadowColor=c; ctx.shadowBlur=12; }
    ctx.moveTo(CX-Math.cos(ang)*len*.18, CY-Math.sin(ang)*len*.18);
    ctx.lineTo(CX+Math.cos(ang)*len, CY+Math.sin(ang)*len);
    ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round'; ctx.stroke(); ctx.restore();
  };
  hand((h/12+m/720)*Math.PI*2-Math.PI/2, R*.52, 5, 'rgba(255,255,255,0.95)');
  hand((m/60+s/3600)*Math.PI*2-Math.PI/2, R*.74, 3.5, 'rgba(255,255,255,0.88)');
  hand(((s+(ms/1000))/60)*Math.PI*2-Math.PI/2, R*.83, 2, ACCENT, true);
  ctx.beginPath(); ctx.arc(CX,CY,5.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,3,0,Math.PI*2); ctx.fillStyle=ACCENT; ctx.fill();
  const p = n => String(n).padStart(2,'0');
  dig.textContent = `${p(now.getHours())}:${p(m)}:${p(s)}`;
  dstr.textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
draw();
setInterval(draw, 250);
</script>
</body>
</html>
