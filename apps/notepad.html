<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script type="application/json" id="wos-manifest">{"id":"notepad","name":"Text Editor","version":"1.0","icon":"📝","category":"productivity","singleton":false,"description":"Multi-tab plain text editor.","winWidth":640,"winHeight":460}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#5b8af5;--font:'Segoe UI',-apple-system,sans-serif;--mono:'Cascadia Code',monospace}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);color:#eaf0ff;background:#0c0e18}
.ed-wrap{display:flex;flex-direction:column;height:100%}
#ed-tabbar{display:flex;align-items:center;background:rgba(0,0,0,0.22);border-bottom:1px solid rgba(255,255,255,0.07);overflow-x:auto;flex-shrink:0;min-height:36px}
.ed-tab{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;height:36px;cursor:pointer;border-right:1px solid rgba(255,255,255,0.07);white-space:nowrap;flex-shrink:0;font-size:12px;color:rgba(255,255,255,0.55);transition:background .12s;min-width:80px;max-width:160px}
.ed-tab.active{background:rgba(255,255,255,0.07);color:#fff;border-bottom:2px solid var(--accent)}
.ed-tab-name{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ed-tab-close{background:none;border:none;color:rgba(255,255,255,0.35);cursor:pointer;padding:2px;border-radius:3px;flex-shrink:0}
.ed-tab-close:hover{color:#fff}
.ed-toolbar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px;height:36px;border-bottom:1px solid rgba(255,255,255,0.07);background:rgba(0,0,0,0.18)}
.ed-btn{padding:4px 11px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);font-size:12px;font-family:var(--font);cursor:pointer;transition:all .13s;font-weight:500}
.ed-btn:hover{background:rgba(255,255,255,0.13);color:#fff}
.ed-fname{font-size:12px;color:rgba(255,255,255,0.45);margin:0 2px;white-space:nowrap;overflow:hidden;max-width:180px;text-overflow:ellipsis}
.ed-status{margin-left:auto;font-size:11px;color:rgba(255,255,255,0.3);white-space:nowrap}
textarea.ed-ta{flex:1;background:transparent;border:none;outline:none;resize:none;color:rgba(255,255,255,0.88);font-size:14px;font-family:var(--mono);padding:16px;line-height:1.75;caret-color:var(--accent);tab-size:2}
.save-overlay{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.save-modal{width:400px;max-width:calc(100% - 32px);background:rgba(12,14,24,0.98);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.13);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,0.7);overflow:hidden}
.save-modal-hd{padding:16px 18px 12px;font-size:14px;font-weight:700;border-bottom:1px solid rgba(255,255,255,0.07)}
.save-modal-body{padding:14px 18px}
.save-label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.save-folders{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.save-folder-btn{padding:6px 13px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.75);font-size:12px;font-weight:500;cursor:pointer;transition:all .13s}
.save-folder-btn.active{background:rgba(91,138,245,0.22);border-color:rgba(91,138,245,0.5);color:var(--accent)}
.save-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:9px;padding:10px 13px;color:#fff;font-size:14px;font-family:var(--font);outline:none}
.save-modal-ft{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid rgba(255,255,255,0.07);background:rgba(0,0,0,0.2)}
.save-action{padding:8px 18px;border-radius:9px;border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer}
.save-action.cancel{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.7)}
.save-action.confirm{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="ed-wrap">
  <div id="ed-tabbar"></div>
  <div class="ed-toolbar">
    <button class="ed-btn" id="ed-new-tab" title="New Tab (Ctrl+T)">+</button>
    <button class="ed-btn" id="ed-save">Save</button>
    <button class="ed-btn" id="ed-saveas">Save As…</button>
    <span class="ed-fname" id="ed-fn"></span>
    <div class="ed-status" id="ed-stat">Ln 1, Col 1</div>
  </div>
  <textarea class="ed-ta" id="ed-ta" spellcheck="false" placeholder="Start typing…"></textarea>
</div>

<script>
function getKernel(){ return window.parent && window.parent !== window ? window.parent.Kernel : window.Kernel; }
function waitForKernel(cb){
  const K = getKernel();
  if (K && K.isReady) { cb(K); return; }
  const tryAgain = () => { const k2 = getKernel(); if (k2) cb(k2); else setTimeout(tryAgain, 60); };
  setTimeout(tryAgain, 60);
}
function toast(icon,title,msg){ getKernel().emit('shell:toast', {icon,title,msg}); }

waitForKernel(async K => {
  const params = new URLSearchParams(location.search);
  const initialPath = params.get('path');

  const tabbar = document.getElementById('ed-tabbar');
  const ta = document.getElementById('ed-ta');
  const stat = document.getElementById('ed-stat');
  const fnEl = document.getElementById('ed-fn');

  let tabs = [], activeId = null, _tid = 0;
  const mkId = () => 't'+(++_tid);

  function renderTabs(){
    tabbar.innerHTML = '';
    tabs.forEach(t => {
      const el = document.createElement('div');
      el.className = 'ed-tab' + (t.id===activeId ? ' active' : '');
      const name = document.createElement('span'); name.className='ed-tab-name'; name.textContent = (t.dirty?'● ':'')+t.name;
      const close = document.createElement('button'); close.className='ed-tab-close'; close.textContent='✕'; close.title='Close (Ctrl+W)';
      close.onclick = ev => { ev.stopPropagation(); closeTab(t.id); };
      el.appendChild(name); el.appendChild(close);
      el.onclick = () => switchTab(t.id);
      tabbar.appendChild(el);
    });
  }

  function switchTab(id){
    if (activeId){ const cur = tabs.find(t=>t.id===activeId); if (cur) cur.content = ta.value; }
    activeId = id;
    const t = tabs.find(t=>t.id===id); if (!t) return;
    ta.value = t.content; fnEl.textContent = t.name;
    renderTabs(); updateStatus(); ta.focus();
  }

  function closeTab(id){
    const idx = tabs.findIndex(t=>t.id===id); if (idx===-1) return;
    tabs.splice(idx,1);
    if (!tabs.length){ addTab('untitled.txt','',null); return; }
    if (activeId===id) switchTab(tabs[Math.min(idx,tabs.length-1)].id);
    else renderTabs();
  }

  function addTab(name, content, fsPath){
    const id = mkId();
    tabs.push({ id, name, content, fsPath, dirty:false, savedContent: content });
    renderTabs(); switchTab(id);
    return id;
  }

  function updateStatus(){
    const before = ta.value.substr(0, ta.selectionStart);
    const lines = before.split('\n');
    stat.textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length+1}  |  ${ta.value.length} ch`;
    const cur = tabs.find(t=>t.id===activeId);
    if (cur){ const wasDirty = cur.dirty; cur.dirty = ta.value !== cur.savedContent; if (wasDirty!==cur.dirty) renderTabs(); }
  }

  function dirName(name){ return { 'Desktop':'/device/desktop', 'Documents':'/device/documents', 'Downloads':'/device/downloads' }[name] || '/device/documents'; }

  function showSaveDialog(defaultName, getContent, onSaved){
    const ov = document.createElement('div'); ov.className='save-overlay';
    const dirs = ['Desktop','Documents','Downloads'];
    ov.innerHTML = `<div class="save-modal"><div class="save-modal-hd">Save As</div><div class="save-modal-body"><div class="save-label">Save to folder</div><div class="save-folders">${dirs.map(d=>`<div class="save-folder-btn${d==='Documents'?' active':''}" data-d="${d}">${d}</div>`).join('')}</div><div class="save-label" style="margin-top:10px">File name</div><input class="save-input" id="sav-fname" value="${defaultName}" autocomplete="off" spellcheck="false"></div><div class="save-modal-ft"><button class="save-action cancel" id="sav-cancel">Cancel</button><button class="save-action confirm" id="sav-ok">Save</button></div></div>`;
    document.body.appendChild(ov);
    let selDir = 'Documents';
    ov.querySelectorAll('.save-folder-btn').forEach(b => b.addEventListener('click', () => { ov.querySelectorAll('.save-folder-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); selDir=b.dataset.d; }));
    ov.querySelector('#sav-cancel').onclick = () => ov.remove();
    ov.querySelector('#sav-ok').onclick = async () => {
      const fname = ov.querySelector('#sav-fname').value.trim(); if (!fname) return;
      const fullPath = dirName(selDir) + '/' + fname;
      await K.fs.write(fullPath, getContent());
      onSaved && onSaved(fullPath, fname);
      toast('💾','Saved',`"${fname}" saved to ${selDir}`);
      ov.remove();
    };
    ov.addEventListener('click', e => { if (e.target===ov) ov.remove(); });
    setTimeout(() => ov.querySelector('#sav-fname').select(), 80);
  }

  async function doSave(){
    const cur = tabs.find(t=>t.id===activeId); if (!cur) return;
    cur.content = ta.value;
    if (cur.fsPath){
      await K.fs.write(cur.fsPath, ta.value);
      cur.dirty = false; cur.savedContent = ta.value; renderTabs();
      toast('💾','Saved',`"${cur.fsPath.split('/').pop()}" updated.`);
      return;
    }
    showSaveDialog(cur.name, () => ta.value, (path, name) => {
      cur.fsPath = path; cur.name = name; cur.dirty = false; cur.savedContent = ta.value;
      fnEl.textContent = name; renderTabs();
    });
  }
  function doSaveAs(){
    const cur = tabs.find(t=>t.id===activeId); if (!cur) return;
    showSaveDialog(cur.name, () => ta.value, (path, name) => {
      cur.fsPath = path; cur.name = name; cur.dirty = false; cur.savedContent = ta.value;
      fnEl.textContent = name; renderTabs();
    });
  }

  document.getElementById('ed-new-tab').onclick = () => addTab('untitled.txt','',null);
  document.getElementById('ed-save').onclick = doSave;
  document.getElementById('ed-saveas').onclick = doSaveAs;
  ta.addEventListener('input', updateStatus);
  ta.addEventListener('click', updateStatus);
  ta.addEventListener('keyup', updateStatus);
  document.addEventListener('keydown', e => {
    if (e.key==='s' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); doSave(); }
    else if (e.key==='t' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); addTab('untitled.txt','',null); }
    else if (e.key==='w' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); if (activeId) closeTab(activeId); }
  });

  if (initialPath){
    try {
      const content = await K.fs.read(initialPath);
      addTab(K.fs.basename(initialPath), content, initialPath);
      tabs[0].savedContent = content;
    } catch(e){ addTab('untitled.txt', '', null); }
  } else {
    addTab('untitled.txt', '', null);
  }
});
</script>
</body>
</html>
