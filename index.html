<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HueBit OS - Bootloader</title>
  <style>
    body { margin:0; background:#000; color:#3aff00; font-family:'Cascadia Code', monospace; overflow:hidden; }
    #boot-screen { padding: 40px; height: 100vh; box-sizing: border-box; display:flex; flex-direction:column; }
    #boot-log { flex:1; overflow-y:auto; font-size:14px; line-height:1.6; white-space:pre-wrap; }
    #boot-log .err { color:#ff5f5f; }
    #boot-log .ok { color:#78e0a0; }
    #boot-log .info { color:#a0c8ff; }
    #shell-root { position:fixed; inset:0; display:none; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(58, 255, 0, 0.3); }
  </style>
</head>
<body>
  <div id="boot-screen">
    <div id="boot-log">Iniciando HueBit OS Bootloader...</div>
  </div>
  <div id="shell-root"></div>

  <!-- El hermoso Kernel -->
  <script src="kernel.js"></script>
  <script>
    const bootLog = document.getElementById('boot-log');
    const bootScreen = document.getElementById('boot-screen');
    const shellRoot = document.getElementById('shell-root');

    // Escuchamos los eventos REALES del kernel
    Kernel.on('boot:step', ({ step, label, detail }) => {
      bootLog.innerHTML += `<div>[<span class="ok">OK</span>] ${label} ${detail ? '<span class="info">('+detail+')</span>' : ''}</div>`;
      bootLog.scrollTop = bootLog.scrollHeight;
    });

    Kernel.on('boot:singleInstance', ({ message }) => {
      bootLog.innerHTML += `<div class="err">[!] ${message}</div>`;
    });

    Kernel.on('boot:critical', ({ reason }) => {
      bootLog.innerHTML += `<div class="err">[CRITICAL] ${reason}. Redirigiendo a reparo...</div>`;
    });

    Kernel.on('boot:error', ({ error }) => {
      bootLog.innerHTML += `<div class="err">[ERROR] ${error}</div>`;
    });

    // Cuando el kernel está listo, cargamos la Shell gráfica
    Kernel.on('ready', async (payload) => {
      bootLog.innerHTML += `<div class="ok">[OK] Kernel listo. Sesión #${payload.sessionCount} iniciada.</div>`;
      bootLog.innerHTML += `<div class="info">Cargando interfaz gráfica (Shell)...</div>`;
      
      await new Promise(r => setTimeout(r, 800));
      
      const res = await fetch('./shell.html');
      const html = await res.text();
      shellRoot.innerHTML = html;
      
      shellRoot.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if(oldScript.src) newScript.src = oldScript.src;
        else newScript.textContent = oldScript.textContent;
        oldScript.remove();
        shellRoot.appendChild(newScript);
      });

      bootScreen.style.transition = "opacity 0.5s";
      bootScreen.style.opacity = 0;
      setTimeout(() => bootScreen.remove(), 500);
      shellRoot.style.display = 'block';
    });
  </script>
</body>
</html>
